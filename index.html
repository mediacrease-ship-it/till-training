<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#fbfbfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Theme vor dem ersten Rendern setzen (kein Aufblitzen). Standard: hell.
  try { var t = localStorage.getItem("gt-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="timer" role="timer" aria-label="Pausen-Timer"></div>
<nav id="tabbar" aria-label="Hauptnavigation"></nav>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<noscript>Diese App braucht JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
